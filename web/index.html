/* ---------- brand tokens ---------- */
body,body[data-brand=causis]{
  --bg:#FAF8F4; --surface:#FFFFFF; --surface-2:#F4F1EB; --hover:#F7F4EE; --ink:#141414; --ink-2:#3A3733; --muted:#7A746B; --faint:#A39D93;
  --line:#E6E1D8; --line-strong:#D6CFC2;
  --accent:#8B1A2F; --accent-ink:#FFFFFF; --accent-soft:#F3E7E9; --accent-2:#6E1424;
  --ok:#2F6B4A; --warn:#9A6A1C; --bad:#A3271F;
  --font:'DM Sans',system-ui,sans-serif; --font-display:'DM Sans',system-ui,sans-serif; --font-label:'IBM Plex Mono',ui-monospace,monospace;
  --h1-size:30px; --h1-weight:300; --h1-track:-.025em;
  --label-size:10.5px; --label-case:uppercase; --label-track:.08em;
  --radius:0px; --radius-sm:0px; --radius-pill:0px; --btn-radius:0px;
  --shadow:none; --shadow-pop:0 18px 48px -18px rgba(20,20,20,.28);
  --nav-on:#EFEBE3; --body-weight:400; --stat-size:34px; --stat-weight:300;
}
body[data-brand=anna]{
  --bg:#F6F3EE; --surface:#FFFFFF; --surface-2:#F1ECE5; --hover:#FBF9F6; --ink:#211D1A; --ink-2:#3B3530; --muted:#7A7368; --faint:#A69E92;
  --line:#ECE6DD; --line-strong:#DDD5C9;
  --accent:#FD6415; --accent-ink:#FFFFFF; --accent-soft:#FFEDE3; --accent-2:#E04A0F;
  --ok:#2E7D57; --warn:#B7791F; --bad:#C4321B;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Geist','Inter',system-ui,sans-serif;
  --font-display:'Geist Pixel',-apple-system,system-ui,sans-serif; --font-label:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  --h1-size:28px; --h1-weight:400; --h1-track:0;
  --label-size:12px; --label-case:none; --label-track:0;
  --radius:16px; --radius-sm:10px; --radius-pill:999px; --btn-radius:10px;
  --shadow:0 1px 2px rgba(33,29,26,.05),0 0 0 1px rgba(33,29,26,.03); --shadow-pop:0 24px 60px -20px rgba(33,29,26,.30);
  --nav-on:#FFFFFF; --body-weight:400; --stat-size:32px; --stat-weight:500;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-weight:var(--body-weight);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.hidden{display:none!important}
::selection{background:var(--accent-soft)}

/* ---------- logos ---------- */
.lockup{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;min-height:30px}
.lockup .word-causis{font-family:'DM Sans',sans-serif;font-weight:300;font-size:19px;letter-spacing:-.025em;line-height:1}
.lockup .word-anna{font-family:'Geist Pixel',monospace;font-size:21px;letter-spacing:.01em;line-height:1}
.lockup .anna-a{font-family:'Geist Pixel',monospace;font-size:22px;color:#E04A0F;line-height:1}
.lockup .tag{font-family:var(--font-label);font-size:10.5px;color:var(--muted);border:1px solid var(--line-strong);padding:1px 6px;border-radius:var(--radius-pill);text-transform:var(--label-case);letter-spacing:var(--label-track);margin-left:2px}
.lockup .plus{color:var(--faint);font-weight:300}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.login-card{width:380px;background:var(--surface);border:1px solid var(--line);padding:34px 32px 28px;box-shadow:var(--shadow-pop)}
.login-card h2{font-family:'DM Sans',sans-serif;font-weight:300;font-size:24px;letter-spacing:-.02em;margin:26px 0 4px}
.login-card p{color:var(--muted);margin:0 0 22px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:248px 1fr;height:100%}
aside{border-right:1px solid var(--line);padding:20px 14px 16px;display:flex;flex-direction:column;gap:22px;background:var(--bg);transition:background-color .25s ease}
body[data-brand=anna] aside{background:#EFEAE3;border-right-color:transparent}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);padding:3px;border-radius:calc(var(--btn-radius) + 2px);gap:2px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:6px 4px;font-size:12.5px;color:var(--muted);border-radius:var(--btn-radius);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
body[data-brand=causis] .seg button.on{box-shadow:inset 0 0 0 1px var(--line)}
.seg .dot{width:7px;height:7px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;display:flex;gap:11px;align-items:center;color:var(--ink-2);border-radius:var(--btn-radius);font-size:14px}
.nav button svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--nav-on);color:var(--ink);font-weight:500}
body[data-brand=causis] .nav button.on{box-shadow:inset 2px 0 0 var(--accent)}
body[data-brand=anna] .nav button.on{box-shadow:var(--shadow)}
.nav button.on svg{opacity:1;color:var(--accent)}

    l = l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
    if (/^\s*[-*] /.test(l)) { if(!inList){out+='<ul>';inList=true;} out+='<li>'+l.replace(/^\s*[-*] /,'')+'</li>'; continue; }
    if (inList){ out+='</ul>'; inList=false; }
    if (/^#{1,3} /.test(l)) out+='<h4>'+l.replace(/^#+ /,'')+'</h4>'; else if (l.trim()) out+='<p>'+l+'</p>';
  }
  return out+(inList?'</ul>':'');
}

  $('#quick').onsubmit = async e => { e.preventDefault(); const t = e.target.title.value.trim(); if (!t) return;
    await sb.from('tasks').insert({ title: t, venture_id: S.venture!=='all'?S.venture:S.ventures[0]?.id }); tasks(el); renderCounts(); };

  const open = (data||[]).filter(t=>t.status!=='done'), done = (data||[]).filter(t=>t.status==='done').slice(0,20);

// ---------- X ----------
function spark(points){
  if (points.length < 2) return '<div class="meta" style="color:var(--muted);font-size:12px;height:60px;display:grid;place-items:center">Collecting data</div>';
  const xs = points.map(p=>+new Date(p.at)), ys = points.map(p=>p.followers);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = x => 4 + (x - x0) / Math.max(1, x1 - x0) * 292, Y = y => 54 - (y - y0) / Math.max(1, y1 - y0) * 48;
  const d = points.map((p,i)=>`${i?'L':'M'}${X(+new Date(p.at)).toFixed(1)},${Y(p.followers).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 300 60" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
async function xview(el){

  const { data: accs } = await vf(sb.from('x_accounts').select('*').order('handle'));

  $('#xb').innerHTML = `<div class="grid g2" style="margin-bottom:18px">${(accs||[]).map((a,i)=>{ const s = stats[i].data||[]; const first = s[0]?.followers, last = s[s.length-1]?.followers;
      const wk = s.filter(p=>+new Date(p.at) >= Date.now()-7*864e5); const wkd = wk.length ? (last - wk[0].followers) : null;
      const mine = (posts||[]).filter(p=>p.account_id===a.id); const imp = mine.reduce((x,p)=>x+p.impressions,0), eng = mine.reduce((x,p)=>x+p.likes+p.reposts+p.replies+p.quotes+p.bookmarks,0);
      return `<div class="card"><div class="row">${vdot(a.venture_id)}<a class="grow" href="https://x.com/${esc(a.handle)}" target="_blank" rel="noopener">@${esc(a.handle)}</a><span class="meta" style="color:var(--muted);font-size:12px">${a.last_synced_at?'updated '+fmtDate(a.last_synced_at):'not synced yet'}</span></div>
        <div class="xhead"><div class="stat"><div class="label">Followers</div><div class="v">${fmtNum(a.followers)}</div></div>
        <div class="stat"><div class="label">7 days</div><div class="v">${wkd==null?'-':(wkd>=0?'+':'')+wkd}</div></div>
        <div class="stat"><div class="label">Eng. rate</div><div class="v">${imp?(eng/imp*100).toFixed(1)+'%':'-'}</div><div class="d">last ${mine.length} posts</div></div></div>
        ${spark(s)}</div>`; }).join('')}</div>
    <div class="label" style="margin-bottom:8px">Recent posts</div>
    <table><thead><tr><th>Account</th><th>Post</th><th class="num">Impr.</th><th class="num">Likes</th><th class="num">Reposts</th><th class="num">Replies</th><th class="num">Bookm.</th><th>Date</th></tr></thead><tbody>
    ${(posts||[]).map(p=>`<tr><td>@${esc(handle(p.account_id))}</td><td style="max-width:420px"><a href="https://x.com/${esc(handle(p.account_id))}/status/${p.id}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(p.text.slice(0,140))}</a></td><td class="num">${fmtNum(p.impressions)}</td><td class="num">${p.likes}</td><td class="num">${p.reposts}</td><td class="num">${p.replies}</td><td class="num">${p.bookmarks}</td><td>${fmtDate(p.created_at)}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">No posts synced yet. Add your X API token in Settings to start tracking.</td></tr>'}
    </tbody></table>`;
}

async function approvals(el){
  const f = S.apprKind || 'all';
  el.innerHTML = `<h1>Approvals</h1><div class="sub">Everything your agents want to send or post waits here</div>
    <div class="tabs">${[['all','All'],['email','Email replies'],['outreach','Outreach'],['x_post','X posts'],['grok_note','Grok Bot']].map(([k,l])=>`<button data-k="${k}" class="${f===k?'on':''}">${l}</button>`).join('')}</div><div id="al"></div>`;
  el.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.apprKind = b.dataset.k; approvals(el); });
  let q = sb.from('approvals').select('*, agents(name)').eq('status','pending').order('created_at',{ascending:false}).limit(100);
  if (f !== 'all') q = q.eq('kind', f);
  const { data } = await vf(q);
  $('#al').innerHTML = (data||[]).map(a => {
    const p = a.payload || {};
    let actions = '', extra = '';
    if (a.kind==='email') { extra = `<div class="meta">To ${esc(p.to)} · ${esc(p.subject)}</div>`; actions = `<button class="btn small primary" data-act="send">Send email</button>`; }
    if (a.kind==='outreach') { extra = `<div class="meta">${esc(p.why||'')}</div><div class="meta" style="margin-top:4px">Route: ${esc(p.route||'')} ${p.url?`· <a href="${esc(p.url)}" target="_blank" rel="noopener">open link</a>`:''}${p.subject?` · Subject: ${esc(p.subject)}`:''}</div>`;
      actions = `${p.to?`<button class="btn small primary" data-act="send">Send from panel</button>`:''}<button class="btn small" data-act="copy">Copy</button><button class="btn small" data-act="done">Mark sent</button>`; }
    if (a.kind==='x_post') { extra = `<div class="meta">${esc(p.why||'')}${p.source_url?` · <a href="${esc(p.source_url)}" target="_blank" rel="noopener">source</a>`:''}</div>`;
      actions = `<a class="btn small primary" data-act="x" href="#" style="text-decoration:none">Open in X</a><button class="btn small" data-act="copy">Copy</button><button class="btn small" data-act="done">Mark posted</button>`; }
    if (a.kind==='grok_note' || a.kind==='content' || a.kind==='other') actions = `<button class="btn small primary" data-act="copy">Copy</button><button class="btn small" data-act="done">Done</button>`;
    return `<div class="appr" data-id="${a.id}"><div class="row">${vdot(a.venture_id)}<b class="grow" style="font-weight:500">${esc(a.title)}</b><span class="pill">${esc(a.agents?.name||'')}</span><span class="meta">${fmtDate(a.created_at)}</span></div>
      ${extra}<textarea data-body>${esc(a.body||'')}</textarea>${a.kind==='x_post'?`<div class="meta" data-len></div>`:''}
      <div class="row">${actions}<span class="grow"></span><button class="btn small ghost" data-act="reject">Reject</button></div></div>`;
  }).join('') || '<div class="list"><div class="empty">Nothing waiting. Your agents will put new drafts here.</div></div>';
  $('#al').querySelectorAll('.appr').forEach(card => {
    const id = card.dataset.id, a = (data||[]).find(x=>x.id===id), ta = card.querySelector('[data-body]'), len = card.querySelector('[data-len]');
    const upd = () => { if (len) { len.textContent = `${ta.value.length} / 280`; len.style.color = ta.value.length>280?'var(--bad)':''; } }; ta.oninput = upd; upd();
    const finish = async (status, msg) => { await sb.from('approvals').update({ status, body: ta.value, decided_at: new Date().toISOString() }).eq('id', id); toast(msg); card.remove(); renderCounts(); };
    card.querySelectorAll('[data-act]').forEach(btn => btn.onclick = async (e) => {
      e.preventDefault(); const act = btn.dataset.act, p = a.payload||{};
      if (act==='copy') return copyText(ta.value);
      if (act==='x') { const acct = p.account ? `Post this as @${p.account}. ` : ''; window.open('https://x.com/intent/post?text='+encodeURIComponent(ta.value), '_blank', 'noopener'); toast(acct + 'Mark posted when done'); return; }
      if (act==='reject') return finish('rejected', 'Rejected');
      if (act==='done') {
        if (a.kind==='outreach' && p.deal_id) await sb.from('deals').update({ stage:'contacted', next_step:'Wait for reply', next_step_date: new Date(Date.now()+5*864e5).toISOString().slice(0,10) }).eq('id', p.deal_id);
        await sb.from('activity').insert({ venture_id: a.venture_id, kind: a.kind, summary: `${a.kind==='x_post'?'Posted':'Sent'}: ${a.title}` });
        return finish('done', 'Marked done');
      }
      if (act==='send') {
        let acct = p.account_id;
        if (!acct) { const { data: ac } = await sb.from('email_accounts').select('id').eq('active', true).limit(1); acct = ac?.[0]?.id; }
        const { error } = await sb.from('outbox').insert({ channel:'email', email_account_id: acct, venture_id: a.venture_id, status:'queued',
          payload: { to: p.to, subject: p.subject || a.title, body: ta.value, in_reply_to: p.in_reply_to || null, from_name: 'Ceriel van den Adel' } });
        if (err(error)) return;
        if (a.kind==='outreach' && p.deal_id) await sb.from('deals').update({ stage:'contacted', next_step:'Wait for reply', next_step_date: new Date(Date.now()+5*864e5).toISOString().slice(0,10) }).eq('id', p.deal_id);
        await finish('done', 'Sending'); const r = await runJob('email-send'); const x = (r.emailSend||[]).find(x=>x.error); toast(x ? 'Failed: '+x.error : 'Sent');
      }
    });
  });
}

// ---------- agents ----------
function sched(a){
  const h = a.at_hour!=null ? `${String(a.at_hour).padStart(2,'0')}:00` : '';
  if (a.every_hours >= 168) return `Weekly${a.weekday?' on '+['','Mon','Tue','Wed','Thu','Fri','Sat','Sun'][a.weekday]:''}${h?' at '+h:''}`;
  if (a.every_hours >= 24) return `Daily${h?' at '+h:''}`;
  return `Every ${a.every_hours}h`;
}

  } else {
    const { data: runs } = await sb.from('agent_runs').select('*, agents(name)').order('started_at',{ascending:false}).limit(60);
    $('#ag').innerHTML = `<table><thead><tr><th>Agent</th><th>Started</th><th>Status</th><th>Result</th><th class="num">Searches</th><th class="num">Cost</th></tr></thead><tbody>${(runs||[]).map(r=>`<tr><td>${esc(r.agents?.name)}</td><td>${new Date(r.started_at).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td><span class="pill ${r.status==='done'?'sent':r.status==='failed'?'failed':''}">${r.status}</span></td><td style="max-width:460px">${esc(r.status==='failed'?r.error:r.summary||'')}</td><td class="num">${r.searches||0}</td><td class="num">$${Number(r.cost_usd||0).toFixed(3)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No runs yet</td></tr>'}</tbody></table>`;
  }
}
function editAgent(a, el){
  openModal(`<h3>${esc(a.name)}</h3><form id="egf" class="fields">
    <label class="f full">Instructions<textarea name="instructions" style="min-height:140px">${esc(a.instructions)}</textarea></label>
    <label class="f">Frequency<select name="every_hours">${[[1,'Every hour'],[6,'Every 6 hours'],[24,'Daily'],[168,'Weekly']].map(([v,l])=>`<option value="${v}" ${v==a.every_hours?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f">At (hour, Amsterdam)<input type="number" min="0" max="23" name="at_hour" value="${a.at_hour??''}"></label>
    <label class="f">Weekday (weekly only)<select name="weekday"><option value="">Any</option>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<option value="${i+1}" ${a.weekday==i+1?'selected':''}>${d}</option>`).join('')}</select></label>
    <label class="f">Model<select name="model">${[['claude-sonnet-5-5','Sonnet (balanced)'],['claude-opus-5-5','Opus (best, pricier)'],['claude-haiku-5-5','Haiku (fast, cheap)']].map(([v,l])=>`<option value="${v}" ${v===a.model?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f">Monthly budget (USD)<input type="number" min="0" step="1" name="monthly_budget_usd" value="${a.monthly_budget_usd}"></label>
    <div class="row full" style="justify-content:flex-end"><button class="btn primary">Save</button></div></form>`);
  $('#egf').onsubmit = async e => { e.preventDefault(); const f = formData(e.target);
    const row = { instructions: f.instructions||'', every_hours: Number(f.every_hours), at_hour: f.at_hour===null?null:Number(f.at_hour), weekday: f.weekday===null?null:Number(f.weekday), model: f.model, monthly_budget_usd: Number(f.monthly_budget_usd) };
    const { error } = await sb.from('agents').update(row).eq('id', a.id); if (err(error)) return; closeModal(); toast('Saved'); agents(el); };
}

// ---------- growth ----------
async function growth(el){
  el.innerHTML = `<h1>Growth</h1><div class="sub">Search and AI-answer visibility, updated weekly by the SEO + AEO agent</div><div id="gr">Loading</div>`;
  const [{ data: prompts }, { data: results }, { data: audits }] = await Promise.all([
    vf(sb.from('aeo_prompts').select('*').eq('active', true).order('created_at')),
    sb.from('aeo_results').select('*').order('at',{ascending:false}).limit(300),
    sb.from('seo_audits').select('*').order('at',{ascending:false}).limit(20),
  ]);
  const latest = id => (results||[]).filter(r=>r.prompt_id===id);
  const sites = [...new Set((audits||[]).map(a=>a.site))].map(s => (audits||[]).find(a=>a.site===s));
  const yn = v => v==null ? '<span class="no">-</span>' : v ? '<span class="yes">yes</span>' : '<span class="no">no</span>';
  $('#gr').innerHTML = `
    <div class="row" style="margin-bottom:8px"><div class="label grow">AI answers: are we mentioned?</div><button class="btn small" id="addP">Add question</button></div>
    <table style="margin-bottom:26px"><thead><tr><th>Question people ask AI</th><th>Causis</th><th>Anna</th><th>Named instead</th><th>Checked</th></tr></thead><tbody>
    ${(prompts||[]).map(p=>{ const r = latest(p.id)[0]; return `<tr class="click" data-p="${p.id}"><td style="max-width:420px">${esc(p.prompt)}</td><td>${yn(r?.mentioned_causis)}</td><td>${yn(r?.mentioned_anna)}</td><td>${(r?.competitors||[]).slice(0,5).map(c=>`<span class="pill">${esc(c)}</span>`).join(' ')}</td><td>${r?fmtDate(r.at):'not yet'}</td></tr>`; }).join('')}
    </tbody></table>
    <div class="label" style="margin-bottom:8px">Website health</div>
    ${sites.length ? `<div class="grid g2">${sites.map(a=>{ const c = a.checks||{}; const chk = (k,l) => `<div class="row" style="gap:8px"><span class="${c[k]?'yes':'no'}" style="width:14px">${c[k]?'✓':'✕'}</span>${l}</div>`;
      return `<div class="card"><div class="row"><a class="grow" href="${esc(a.site)}" target="_blank" rel="noopener" style="font-weight:500">${esc(a.site.replace('https://',''))}</a><div class="stat"><div class="v" style="margin:0;font-size:28px">${a.score}</div></div></div>
      <div class="meta" style="margin:2px 0 12px">Checked ${fmtDate(a.at)}</div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px">${chk('title_ok','Title length')}${chk('description_ok','Meta description')}${chk('single_h1','One H1')}${chk('open_graph','Share preview (OG)')}${chk('canonical','Canonical URL')}${chk('has_structured_data','Structured data')}${chk('sitemap','Sitemap')}${chk('robots_txt','robots.txt')}${chk('llms_txt','llms.txt (for AI)')}${chk('enough_text','Enough text')}</div>
      <div class="label" style="margin:16px 0 6px">Top fixes</div>${(a.recommendations||[]).map((r,i)=>`<div style="margin-bottom:8px"><b style="font-weight:500">${i+1}. ${esc(r.title)}</b><div class="meta">${esc(r.how||'')}</div></div>`).join('') || '<div class="meta">None yet</div>'}</div>`; }).join('')}</div>`
      : '<div class="list"><div class="empty">No audit yet. Run the SEO + AEO agent from Agents.</div></div>'}`;
  $('#gr').querySelectorAll('[data-p]').forEach(r => r.onclick = () => { const res = latest(r.dataset.p); const p = prompts.find(x=>x.id===r.dataset.p);
    openModal(`<h3>${esc(p.prompt)}</h3>${res.slice(0,3).map(x=>`<div class="label" style="margin:12px 0 4px">${esc(x.engine)} · ${fmtDate(x.at)}</div><div class="md">${md(x.excerpt)}</div>`).join('') || '<div class="meta">Not checked yet</div>'}
      <div class="row" style="margin-top:16px"><button class="btn small" id="rmP">Stop tracking</button></div>`);
    $('#rmP').onclick = async () => { await sb.from('aeo_prompts').update({ active:false }).eq('id', p.id); closeModal(); growth(el); }; });
  $('#addP').onclick = () => { openModal(`<h3>Track a question</h3><form id="pf2" class="fields"><label class="f full">What would a potential user or investor ask an AI assistant?<input name="prompt" required></label>
      <label class="f">Venture${ventureSelect('venture_id', S.venture!=='all'?S.venture:S.ventures[0]?.id)}</label><div class="row full" style="justify-content:flex-end"><button class="btn primary">Add</button></div></form>`);
    $('#pf2').onsubmit = async e => { e.preventDefault(); const f = formData(e.target); await sb.from('aeo_prompts').insert(f); closeModal(); growth(el); }; };
}

// ---------- telegram ----------
function telegram(el){
  el.innerHTML = `<h1>Telegram</h1><div class="sub">Coming next</div><div class="card" style="max-width:560px">Your personal Telegram account will sync here: tracked chats per venture, unread counts and replies from the panel. This needs a small always-on worker, which we'll set up once you're ready.</div>`;
}

// ---------- outbox ----------
async function outbox(el){
  el.innerHTML = `<h1>Outbox</h1><div class="sub">Everything queued, scheduled, sent or failed</div><div id="ob"></div>`;
  const { data } = await vf(sb.from('outbox').select('*').order('created_at',{ascending:false}).limit(100));
  $('#ob').innerHTML = `<table><thead><tr><th>Channel</th><th>To</th><th>Subject</th><th>Status</th><th>When</th><th></th></tr></thead><tbody>${(data||[]).map(o=>`<tr><td>${o.channel}</td><td>${esc(o.payload.to||'')}</td><td>${esc(o.payload.subject||o.payload.text||'')}${o.error?`<div style="color:var(--bad);font-size:12px">${esc(o.error)}</div>`:''}</td><td><span class="pill ${o.status}">${o.status}</span></td><td>${fmtDate(o.sent_at||o.scheduled_for||o.created_at)}</td><td>${['draft','failed'].includes(o.status)?`<button class="btn small" data-q="${o.id}">Send</button>`:''}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nothing yet</td></tr>'}</tbody></table>`;
  $('#ob').querySelectorAll('[data-q]').forEach(b => b.onclick = async () => { await sb.from('outbox').update({ status:'queued', error:null }).eq('id', b.dataset.q); await runJob('email-send'); outbox(el); });
}

// ---------- settings ----------
async function settings(el){
  el.innerHTML = `<h1>Settings</h1><div class="sub">Accounts and background jobs</div><div id="sb"></div>`;
  const [{ data: accts }, { data: hb }, { data: xacc }] = await Promise.all([sb.from('email_accounts').select('*').order('created_at'), sb.from('worker_heartbeat').select('*'), sb.from('x_accounts').select('*')]);
  await Promise.all((accts||[]).map(async a => { const { data } = await sb.rpc('email_password_set', { p_account_id: a.id }); a._pw = data === true; }));
  $('#sb').innerHTML = `
    <div class="row" style="margin-bottom:8px"><div class="label grow">Email accounts</div><button class="btn small" id="addAcct">Add account</button></div>
    <table><thead><tr><th>Account</th><th>Venture</th><th>Password</th><th>Status</th><th>Last sync</th><th></th></tr></thead><tbody>
    ${(accts||[]).map(a=>`<tr><td>${esc(a.label)}<div style="color:var(--muted);font-size:12px">${esc(a.address)}</div></td><td>${vdot(a.venture_id)} ${esc(vname(a.venture_id))}</td><td>${a._pw?'<span class="pill sent">saved</span>':'<span class="pill failed">missing</span>'}</td>
      <td>${!a.active?'<span class="pill">off</span>':a.last_error?`<span class="pill failed">error</span><div style="color:var(--bad);font-size:12px">${esc(a.last_error)}</div>`:a.last_synced_at?'<span class="pill sent">ok</span>':'<span class="pill">waiting</span>'}</td>
      <td>${a.last_synced_at?fmtDate(a.last_synced_at):''}</td><td style="white-space:nowrap"><button class="btn small primary" data-pw="${a.id}" data-addr="${esc(a.address)}">Set password</button> <button class="btn small" data-tog="${a.id}" data-on="${a.active}">${a.active?'Turn off':'Turn on'}</button></td></tr>`).join('')}</tbody></table>
    <p style="color:var(--muted);font-size:12.5px;max-width:720px">Mailbox passwords are stored encrypted in the Supabase vault. The panel can save them but never read them back.</p>
    <div class="row" style="margin:26px 0 8px"><div class="label grow">AI model (agents)</div><span id="aitok"></span><button class="btn small primary" id="setAI">Set Anthropic API key</button></div>
    <div class="card meta" style="margin-bottom:6px">Your agents run on Claude through the Anthropic API. Create a key at console.anthropic.com under API keys. Spending per agent is capped in Agents.</div>
    <div class="row" style="margin:26px 0 8px"><div class="label grow">X accounts</div><span id="xtok"></span><button class="btn small primary" id="setX">Set X API token</button></div>
    <table><thead><tr><th>Handle</th><th>Venture</th><th>Followers</th><th>Last update</th></tr></thead><tbody>${(xacc||[]).map(x=>`<tr><td>@${esc(x.handle)}</td><td>${vdot(x.venture_id)} ${esc(vname(x.venture_id))}</td><td>${fmtNum(x.followers)}</td><td>${x.last_synced_at?fmtDate(x.last_synced_at):'waiting for token'}</td></tr>`).join('')}</tbody></table>
    <div class="label" style="margin:22px 0 8px">Background jobs</div>
    <table><thead><tr><th>Job</th><th>Last run</th><th>Result</th></tr></thead><tbody>${(hb||[]).map(h=>`<tr><td>${esc(h.name)}</td><td>${new Date(h.last_seen).toLocaleString()}</td><td><code style="font-family:var(--mono);font-size:11.5px">${esc(JSON.stringify(h.info).slice(0,220))}</code></td></tr>`).join('')}</tbody></table>`;
  $('#sb').querySelectorAll('[data-pw]').forEach(b => b.onclick = () => {
    openModal(`<h3>Mailbox password</h3><form id="pf" class="fields"><div class="full meta">For ${b.dataset.addr}. This is the password you use for webmail at privateemail.com.</div>
      <label class="f full">Password<input type="password" name="pw" autocomplete="off" required></label>
      <div class="row full" style="justify-content:flex-end"><button class="btn primary">Save and sync</button></div></form>`);
    $('#pf').onsubmit = async e => { e.preventDefault(); const { error } = await sb.rpc('set_email_password', { p_account_id: b.dataset.pw, p_password: e.target.pw.value });
      if (err(error)) return; closeModal(); toast('Saved. Syncing'); const r = await runJob('email-sync'); const x = (r.emailSync||[]).find(x=>x.account===b.dataset.addr);
      toast(x?.error ? 'Login failed: ' + x.error : `Connected. ${x?.inserted ?? 0} emails imported`); settings(el); renderCounts(); };
  });
  sb.rpc('app_secret_set', { p_name: 'x_bearer' }).then(({ data }) => { $('#xtok').innerHTML = data ? '<span class="pill sent">token saved</span>' : '<span class="pill failed">no token</span>'; });
  sb.rpc('app_secret_set', { p_name: 'anthropic' }).then(({ data }) => { $('#aitok').innerHTML = data ? '<span class="pill sent">key saved</span>' : '<span class="pill failed">no key</span>'; });
  $('#setAI').onclick = () => {
    openModal(`<h3>Anthropic API key</h3><form id="af2" class="fields"><div class="full meta">Starts with sk-ant-. Stored encrypted; the panel can't show it again.</div>
      <label class="f full">API key<input type="password" name="t" autocomplete="off" required></label>
      <div class="row full" style="justify-content:flex-end"><button class="btn primary">Save</button></div></form>`);
    $('#af2').onsubmit = async e => { e.preventDefault(); const { error } = await sb.rpc('set_app_secret', { p_name: 'anthropic', p_value: e.target.t.value.trim() });
      if (err(error)) return; closeModal(); toast('Saved. Agents can run now'); settings(el); };
  };
  $('#setX').onclick = () => {
    openModal(`<h3>X API token</h3><form id="xf" class="fields"><div class="full meta">The Bearer Token from your app at developer.x.com, under Keys and tokens. Read only: it can't post or change anything.</div>
      <label class="f full">Bearer token<input type="password" name="t" autocomplete="off" required></label>
      <div class="row full" style="justify-content:flex-end"><button class="btn primary">Save and fetch</button></div></form>`);
    $('#xf').onsubmit = async e => { e.preventDefault(); const { error } = await sb.rpc('set_app_secret', { p_name: 'x_bearer', p_value: e.target.t.value.trim() });
      if (err(error)) return; closeModal(); toast('Saved. Fetching X stats'); const r = await runJob('x-metrics'); const x = (r.xMetrics||[]).find(x=>x.error||x.skipped);
      toast(x ? 'X said: ' + (x.error||x.skipped).slice(0,120) : 'X stats updated'); settings(el); };
  };
  $('#sb').querySelectorAll('[data-tog]').forEach(b => b.onclick = async () => { await sb.from('email_accounts').update({ active: b.dataset.on !== 'true' }).eq('id', b.dataset.tog); settings(el); });
  $('#addAcct').onclick = () => {
    openModal(`<h3>Add email account</h3><form id="af" class="fields">
      <label class="f">Label<input name="label" placeholder="Anna hello" required></label>
      <label class="f">Venture${ventureSelect('venture_id', S.venture!=='all'?S.venture:S.ventures[0]?.id)}</label>
      <label class="f full">Address<input name="address" type="email" required></label>
      <label class="f">IMAP host<input name="imap_host" value="mail.privateemail.com"></label>
      <label class="f">SMTP host<input name="smtp_host" value="mail.privateemail.com"></label>
      <div class="row full" style="justify-content:flex-end"><button class="btn primary">Add</button></div></form>`);
    $('#af').onsubmit = async e => { e.preventDefault(); const f = formData(e.target); f.username = f.address;
      f.secret_ref = 'EMAIL_PW_' + f.address.toUpperCase().replace(/[^A-Z0-9]+/g,'_');
      const { error } = await sb.from('email_accounts').insert(f); if (err(error)) return; closeModal(); toast('Added. Now set its password'); settings(el); };
  };
}

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.reload(); });
boot();
</script>
</body>
</html>
